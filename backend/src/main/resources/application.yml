spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8080}
jwt:
  secret: ${JWT_SECRET:change-me-very-long-secret-key-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
